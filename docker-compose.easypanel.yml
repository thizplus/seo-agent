services:
  postgres:
    image: postgres:16-alpine
    container_name: seo_agents_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-seo_agents}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-seo_agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-seo_agents}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seo_agents_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build: ./ai-engine
    container_name: seo_agents_ai
    restart: always
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: seo_agents_backend
    restart: always
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      FRONTEND_URL: https://su3k.com
      GOOGLE_REDIRECT_URL: https://api.su3k.com/api/v1/auth/google/callback
      COOKIE_DOMAIN: .su3k.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: seo_agents_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://api.su3k.com
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
